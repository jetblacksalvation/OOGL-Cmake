on:
  push:
    branches: 
      - master  # You can change this to whatever branch triggers the release

name: Build and Release

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      # Checkout the code
      - name: Checkout code
        uses: actions/checkout@v2

      # Get the latest tag and generate a new one
      - name: Get latest tag
        id: get_latest_tag
        run: |
          # Get the latest tag
          latest_tag=$(git describe --tags --abbrev=0 || echo "v0.0.0")
          # Generate new tag by incrementing the version or using timestamp
          echo "Latest tag: $latest_tag"
          new_tag="v$(date +'%Y%m%d%H%M%S')"  # Create a tag based on timestamp
          echo "New tag: $new_tag"
          echo "::set-output name=new_tag::$new_tag"

      # Create a new tag
      - name: Create new tag
        run: |
          git tag ${{ steps.get_latest_tag.outputs.new_tag }}
          git push origin ${{ steps.get_latest_tag.outputs.new_tag }}

      # Configure the project with CMake
      - name: Configure CMake
        run: cmake -S . -B build

      # Build the project
      - name: Build project
        run: cmake --build build --config Release

      # Create a GitHub Release with the dynamically generated tag
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.get_latest_tag.outputs.new_tag }}
          release_name: Release ${{ steps.get_latest_tag.outputs.new_tag }}
          body: |
            Changes in this release:
            - First Change
            - Second Change
          draft: false
          prerelease: false

      # Upload Release Assets
      - name: Upload Release Assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            build/OOGL_LIB.dll
            build/OOGL_LIB.ilk
            build/OOGL_LIB.pdb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
