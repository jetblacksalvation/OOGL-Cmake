on:
  push:
    tags: ["*"]  # This triggers on any tag push

name: Build and Release

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v2

      # Get the latest tag and generate a new one
      - name: Get latest tag
        id: get_latest_tag
        run: |
          # Use PowerShell to get the latest tag, or use a default if no tags exist
          $latest_tag = git describe --tags --abbrev=0
          if (-not $latest_tag) { $latest_tag = "v0.0.0" }
          # Create a new tag based on timestamp
          $new_tag = "v$(Get-Date -Format 'yyyyMMddHHmmss')"
          echo "Latest tag: $latest_tag"
          echo "New tag: $new_tag"
          echo "::set-output name=new_tag::$new_tag"

      # Create a new tag
      - name: Create new tag
        run: |
          git tag ${{ steps.get_latest_tag.outputs.new_tag }}
          git push origin ${{ steps.get_latest_tag.outputs.new_tag }}

      # Configure the project with CMake
      - name: Configure CMake
        run: cmake -S . -B build

      # Build the project
      - name: Build project
        run: cmake --build build --config Release

      # Create a GitHub Release with the dynamically generated tag
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.get_latest_tag.outputs.new_tag }}
          release_name: Release ${{ steps.get_latest_tag.outputs.new_tag }}
          body: |
            Changes in this release:
            - First Change
            - Second Change
          draft: false
          prerelease: false

      # Upload Release Assets
      - name: Upload Release Assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            build/OOGL_LIB.dll
            build/OOGL_LIB.ilk
            build/OOGL_LIB.pdb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
