on:
  push:
    tags: ["*"]  # Trigger on any tag push

name: Build and Release

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v2

      # Get the latest tag and create a new one based on the timestamp
      - name: Get latest tag
        id: get_latest_tag
        run: |
          # Use PowerShell to get the latest tag or default to v0.0.0 if no tags are found
          $latest_tag = git describe --tags --abbrev=0
          if (-not $latest_tag) {
            $latest_tag = "v0.0.0"
          }
          
          # Generate a new tag based on the current date and time
          $new_tag = "v$(Get-Date -Format 'yyyyMMddHHmmss')"

          # Output the latest and new tag for debugging purposes
          Write-Host "Latest tag: $latest_tag"
          Write-Host "New tag: $new_tag"

          # Set the new tag as output for use in the next steps
          echo "::set-output name=new_tag::$new_tag"

      # Create a new tag based on the timestamp
      - name: Create new tag
        run: |
          git tag ${{ steps.get_latest_tag.outputs.new_tag }}
          git push origin ${{ steps.get_latest_tag.outputs.new_tag }}

      # Configure the project with CMake
      - name: Configure CMake
        run: cmake -S . -B build

      # Build the project
      - name: Build project
        run: cmake --build build --config Release

      # Create a GitHub Release with the dynamically generated tag
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.get_latest_tag.outputs.new_tag }}
          release_name: Release ${{ steps.get_latest_tag.outputs.new_tag }}
          body: |
            Changes in this release:
            - First Change
            - Second Change
          draft: false
          prerelease: false

      # Upload Release Assets
      - name: Upload Release Assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            build/OOGL_LIB.dll
            build/OOGL_LIB.ilk
            build/OOGL_LIB.pdb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
s
